server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 100m;
 client_body_timeout 120s;
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_comp_level 5;
 gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain text/xml;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /health { access_log off; return 200 'ok'; }
 location /api/ { proxy_request_buffering off; proxy_read_timeout 120s; proxy_pass http://core-api:3001; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
 location = /config.json {
  add_header Cache-Control no-store;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
 }
 location = /index.html {
  add_header Cache-Control no-cache;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
 }
 # Vite 生成的文件名含内容哈希，可以安全地长期缓存。
 location ^~ /assets/ {
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
 }
 location / { try_files $uri $uri/ /index.html; }
}
