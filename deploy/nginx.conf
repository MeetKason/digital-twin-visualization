server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 100m;
 client_body_timeout 120s;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /health { access_log off; return 200 'ok'; }
 location /api/ { proxy_request_buffering off; proxy_read_timeout 120s; proxy_pass http://core-api:3001; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
 location = /config.json { add_header Cache-Control no-store; }
 location / { try_files $uri $uri/ /index.html; }
}
